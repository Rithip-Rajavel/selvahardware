spring.application.name=selvahardware

# ===== PostgreSQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/selvahardware
spring.datasource.username=root
spring.datasource.password=Password@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT Configuration =====
app.jwt.secret=selvahardware-super-secret-jwt-key-must-be-at-least-256-bits-long-12345678
app.jwt.expiration=86400000

# ===== Swagger / SpringDoc =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ===== Server =====
server.port=5090

# ===== SQL Initialization (seed data) =====
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===== Logging =====
logging.level.com.hardware.selvahardware=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.servlet.context-path=/selvahardware