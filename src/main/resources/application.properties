spring.application.name=selvahardware

# ===== PostgreSQL Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/selvahardware
spring.datasource.username=postgres
spring.datasource.password=Password@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT Configuration =====
app.jwt.secret=selvahardware-super-secret-jwt-key-must-be-at-least-256-bits-long-12345678
app.jwt.expiration=86400000

# ===== Swagger / SpringDoc =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ===== Server =====
server.port=8080

# ===== SQL Initialization (seed data) =====
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ===== Logging =====
logging.level.com.hardware.selvahardware=INFO
logging.level.org.springframework.security=WARN
